apiVersion: v1
kind: ConfigMap
metadata:
  name: initclone
data:
  rclone.conf: |
    [foo]
    type = s3
    provider = AWS
    env_auth = true
  files.yaml: |
    - remote: foo
      source: path_in_bucket/GeoLite2-City.mmdb
      dest: /shared/GeoLite2-City.mmdb
      mode: "0644"
      owner: "1000"
      group: "1000"
---
apiVersion: v1
kind: Pod
metadata:
  name: initclone-example
spec:
  restartPolicy: Never
  initContainers:
    - name: initclone
      image: ghcr.io/OWNER/initclone:latest
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: object-storage
              key: access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage
              key: secret-access-key
      volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: shared
          mountPath: /shared
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: shared
          mountPath: /shared
          readOnly: true
  volumes:
    - name: config
      configMap:
        name: initclone
    - name: shared
      emptyDir: {}
